services:
  - type: web
    name: enginex-engineering-marketplace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: enginex-marketplace-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@enginex.com
      - key: ADMIN_PASSWORD
        value: Admin@123

databases:
  - name: enginex-marketplace-db
    plan: free
    databaseName: enginex
    user: enginex

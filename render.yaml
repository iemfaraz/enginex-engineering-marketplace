services:
  - type: web
    name: enginex-engineering-marketplace
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enginex-marketplace-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: enginex-marketplace-db
    plan: free
    region: frankfurt
    databaseName: enginex
    user: enginex
